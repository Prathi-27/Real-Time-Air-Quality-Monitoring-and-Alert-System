<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Air Quality Monitor - Sign In</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Air Quality / Wind Icon at Top -->
            <div class="icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
                    <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
                    <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
                </svg>
            </div>

            <!-- Header and Subtitle -->
            <div class="login-header">
                <h1>Welcome to Air Quality Monitor</h1>
                <p>Monitor air quality and stay informed about your environment.</p>
            </div>

            <!-- Dynamic Alert for Feedback / Errors -->
            <div id="alertBox" class="alert-box">
                <span id="alertMsg"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" method="POST" action="LoginServlet" autocomplete="on">
                <!-- Email Address Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="name@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password Field with Eye Icon for Visibility -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-eye-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Purple/Indigo Sign In Button -->
                <button type="submit" class="btn-signin" id="submitBtn">
                    <span>Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </form>

            <div class="card-footer">
                Don't have an account? <a href="register.html">Create an account</a>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
