<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your Air Quality Account</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        .register-card {
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card register-card">
            <!-- Icon at Top -->
            <div class="icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
                </svg>
            </div>

            <!-- Heading -->
            <div class="login-header">
                <h1>Create your Air Quality Account</h1>
                <p>Register to monitor air quality and track historical searches</p>
            </div>

            <!-- Dynamic Alert for Feedback / Errors -->
            <div id="alertBox" class="alert-box">
                <span id="alertMsg"></span>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" method="POST" action="RegistrationServlet">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-container">
                        <input 
                            type="text" 
                            id="fullName" 
                            name="full_name" 
                            class="form-input" 
                            placeholder="John Doe" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="name@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="At least 6 characters" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-eye-btn" id="togglePasswordBtn1" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirm_password" 
                            class="form-input" 
                            placeholder="Re-type your password" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-eye-btn" id="togglePasswordBtn2" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="btn-signin" id="submitBtn">
                    <span>Create Account</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </form>

            <div class="card-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
